name: Unit tests

on: [push]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-versions: ['8.2', '8.3', '8.4']
    name: Testing on PHP ${{ matrix.php-versions }}
    steps:
      - uses: actions/checkout@v6
      - name: setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring,bcmath
          coverage: pcov
          tools: phpunit,composer

      - name: install deps
        run: composer install -o -q

      - name: phpunit
        run: phpunit -c phpunit.xml.dist

      - name: Publish Test & Coverage Summary
        if: always()
        run: php .github/scripts/test-summary.php ${{ matrix.php-versions }}

      - name: Commit Coverage Badge
        if: github.ref == 'refs/heads/10.x' && matrix.php-versions == '8.4'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.svg
          git diff --staged --quiet || (git commit -m "chore: update coverage badge [skip ci]" && git push)
